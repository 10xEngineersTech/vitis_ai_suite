# conv3d_fix additions for the KV260 DPU link (kv260_custom_platform).
#
# The KV260 holds ONE xclbin, and the DPU app keeps it loaded, so conv3d_fix
# must be linked into the same xclbin as DPUCZDX8G. See README.md (Build,
# step 4) for where these lines go.
#
# Memory: only HPC0, HP0, HP1, HP2 are enabled on this platform. The DPU
# (HP0/HP1) is idle while the CPU subgraph with the 3D convs runs, so sharing
# its ports costs nothing. weight/tab/cfg are
# one AXI bundle (gmem2) and must stay on the same bank.
[connectivity]
nk=conv3d_fix:1:conv3d_fix_1
sp=conv3d_fix_1.input:HP0
sp=conv3d_fix_1.output:HP1
sp=conv3d_fix_1.weight:HP2
sp=conv3d_fix_1.tab:HP2
sp=conv3d_fix_1.cfg:HP2

# Clocks are fixed. kv260_custom_platform clock ids: 1 = 100 MHz, 2 = 200 MHz,
# 3 = 400 MHz. Use 2 (200 MHz, the DPU's aclk) for conv3d_fix:
# a kernel on another clock than the HP-port interconnect gets a clock
# converter there, which failed timing.
[clock]
id=2:conv3d_fix_1.ap_clk

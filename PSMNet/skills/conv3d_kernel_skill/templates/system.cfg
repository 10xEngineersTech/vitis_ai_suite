# v++ link additions for a custom kernel next to DPUCZDX8G on kv260_custom_platform.
# Real example: kernel/fpga/system.cfg. Merge into the DPU link config
# (IDE: dpu_system_hw_link -> Hardware -> container settings box), then check
# the generated Hardware/dpu-link.cfg. Every master needs an sp= line.
[connectivity]
nk=myop_fix:1:myop_fix_1
sp=myop_fix_1.input:HP0        # gmem0
sp=myop_fix_1.output:HP1       # gmem1
sp=myop_fix_1.weight:HP2       # gmem2: all args of one bundle -> same bank
sp=myop_fix_1.tab:HP2
sp=myop_fix_1.cfg:HP2

# Platform clock ids: 1 = 100 MHz, 2 = 200 MHz, 3 = 400 MHz (read the .hpfm,
# see SKILL.md step 25). Put every PL kernel on the DPU's aclk clock (id 2):
# another clock puts a clock converter into the HP interconnect.
[clock]
id=2:myop_fix_1.ap_clk

# Timing closure help (route-dominated misses of tens of ps)
[vivado]
prop=run.impl_1.STEPS.POST_ROUTE_PHYS_OPT_DESIGN.IS_ENABLED=true
prop=run.impl_1.STEPS.POST_ROUTE_PHYS_OPT_DESIGN.ARGS.DIRECTIVE=AggressiveExplore
prop=run.impl_1.STEPS.ROUTE_DESIGN.ARGS.DIRECTIVE=AggressiveExplore
